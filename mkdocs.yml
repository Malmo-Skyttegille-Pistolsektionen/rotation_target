site_name: Rotation Target
site_description: Documentation for the Rotation Target shooting-range system
repo_url: https://github.com/Malmo-Skyttegille-Pistolsektionen/rotation_target
repo_name: rotation_target
docs_dir: docs/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy

nav:
  - Home: index.md
  - Hardware and wiring: hardware.md
  - Flashing a board: flashing.md
  - Connecting: connecting.md
  - Running a program: running-a-program.md
  - Programs and audio: programs-and-audio.md
  - Writing your own program: writing-a-program.md
  - Settings: settings.md
  - Status LED: status-led.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - tables
  - admonition
  # The editor link on the front page is rendered as a button.
  - attr_list
  # Lets writing-a-program.md embed the example program from the same file
  # the page links for download, so the two cannot drift apart.
  - pymdownx.snippets:
      base_path: [docs/site]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
