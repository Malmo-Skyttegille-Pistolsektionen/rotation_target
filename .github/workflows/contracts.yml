---
name: contracts

on:
  push:
    branches: [main]
    paths:
      - contracts/**
      - resources/**
      - .github/workflows/contracts.yml
  pull_request:
    paths:
      - contracts/**
      - resources/**
      - .github/workflows/contracts.yml

  # Called by release.yml so the release is gated on the same checks that guard
  # main, run at the exact commit that gets tagged.
  workflow_call:

permissions:
  contents: read

# A superseded run should not keep this going. The group carries a literal
# prefix as well as `github.workflow`, because `github.workflow` is the *caller*
# name when release.yml calls this workflow - without the prefix, two workflows
# called from the same release run would land in one group and cancel each
# other.
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contract and program validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      # Pinned like every other tool here: an unpinned CLI can turn main red
      # from an upstream rule change with no commit of ours behind it.
      - name: Install check-jsonschema
        run: pip install check-jsonschema==0.38.0

      # Lints openapi.yaml and asyncapi.yaml, checks program.schema.json is a
      # valid schema, and validates every shipped program against it.
      - name: Validate the contracts
        run: ./contracts/validate.sh

      # The program-side rules the contracts do not cover: shipped ids stay out
      # of the upload range, and every audio_ids entry resolves to a clip that
      # exists.
      - name: Validate the shipped programs
        run: ./resources/programs/validate_programs.sh

      # The same boundary on the audio side, plus every entry naming a file that
      # is actually there.
      - name: Validate the shipped audio
        run: ./resources/audios/validate_audios.sh

  # Answers "does this PR break the contract?" by diffing openapi.yaml and
  # asyncapi.yaml against the merge base on main. The other question worth
  # asking - "does this release break the contract?", against the last
  # released tag - is not answerable yet: no tag has been cut. See #176.
  #
  # PR-only, deliberately: on push (post-merge on main) and workflow_call
  # (release.yml, before tagging), HEAD is already on/ahead of main, so
  # merge-base(HEAD, main) is HEAD itself and the diff would be against
  # itself - not a bug, just not a question this baseline can answer there.
  #
  # A breaking change is not refused outright: contracts/README.md and
  # AGENTS.md say breaking changes are allowed - they move the path prefix
  # (/api/v3) instead of bumping info.version. This job fails on one anyway,
  # because "allowed" still means "a human decides on purpose", not "silent".
  breaking-changes:
    name: breaking change detection
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets oasdiff-action post its side-by-side review link as a PR comment
      # instead of only the job summary.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
          # Need history back to the merge base with main, not just this PR's
          # commits.
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Find the merge base with main
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --quiet
          SHA="$(git merge-base HEAD "origin/$BASE_REF")"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # A spec this PR introduces has no baseline to diff against - that
          # is a new file, not a breaking change to an existing one.
          if git cat-file -e "$SHA:contracts/openapi.yaml" 2>/dev/null; then
            echo "openapi-existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "openapi-existed=false" >> "$GITHUB_OUTPUT"
          fi
          if git cat-file -e "$SHA:contracts/asyncapi.yaml" 2>/dev/null; then
            echo "asyncapi-existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "asyncapi-existed=false" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error: both specs get diffed even if one already failed,
      # so a reviewer sees the whole picture in one run. The job is failed
      # explicitly by the verdict step below.
      - name: OpenAPI - breaking changes (oasdiff)
        id: openapi
        if: steps.base.outputs.openapi-existed == 'true'
        continue-on-error: true
        uses: oasdiff/oasdiff-action/breaking@2649ebe137aeb72a95707671204e829f86e091fc  # v0.1.13
        with:
          base: "${{ steps.base.outputs.sha }}:contracts/openapi.yaml"
          revision: "HEAD:contracts/openapi.yaml"
          fail-on: WARN
          github-token: ${{ github.token }}

      - name: AsyncAPI - breaking changes (AsyncAPI CLI)
        id: asyncapi
        if: steps.base.outputs.asyncapi-existed == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          git show "${{ steps.base.outputs.sha }}:contracts/asyncapi.yaml" \
            > "$RUNNER_TEMP/asyncapi-base.yaml"

          # Pinned to the same release contracts/validate.sh pins for
          # `validate`, so CI does not carry two versions of the same CLI.
          npx --yes @asyncapi/cli@6.0.2 diff \
            "$RUNNER_TEMP/asyncapi-base.yaml" contracts/asyncapi.yaml \
            --type breaking
          status=$?

          # `unclassified` is a third bucket the CLI can't place in either
          # one. Measured empirically against this repo's asyncapi.yaml: it is
          # dominated by parser bookkeeping (x-parser-schema-id churns on any
          # edit at all, breaking or not) - a purely additive change produced
          # dozens of unclassified entries and zero breaking ones. Failing on
          # it would turn every additive change red too, so it is surfaced as
          # a warning instead.
          npx --yes @asyncapi/cli@6.0.2 diff \
            "$RUNNER_TEMP/asyncapi-base.yaml" contracts/asyncapi.yaml \
            --type unclassified --format json --no-error \
            --save-output "$RUNNER_TEMP/asyncapi-unclassified.json"
          # Filtered to a single --type, the CLI's JSON output is a bare
          # array - it's only wrapped in {"changes": [...]} for --type all.
          COUNT="$(python3 -c \
            "import json; print(len(json.load(open('$RUNNER_TEMP/asyncapi-unclassified.json'))))")"
          if [ "$COUNT" -gt 0 ]; then
            echo "::warning::asyncapi.yaml: $COUNT unclassified change(s), not failed on (see step source)."
          fi

          exit "$status"

      - name: Verdict
        if: always()
        run: |
          set -uo pipefail
          failed=false
          if [ "${{ steps.openapi.outcome }}" = "failure" ]; then
            echo "::error::contracts/openapi.yaml has a breaking change against the merge base on main."
            failed=true
          fi
          if [ "${{ steps.asyncapi.outcome }}" = "failure" ]; then
            echo "::error::contracts/asyncapi.yaml has a breaking change against the merge base on main."
            failed=true
          fi
          if [ "$failed" = "true" ]; then
            echo "::error::A breaking change is allowed here - it just cannot ship under the current path"
            echo "::error::prefix. Move it (/api/v2 -> /api/v3, /sse/v2 -> /sse/v3) and mark the commit"
            echo "::error::'!' or with a 'BREAKING CHANGE:' footer, so the release version bumps"
            echo "::error::correctly - see contracts/README.md and AGENTS.md. If both are already done,"
            echo "::error::this failure is expected: merging past it is a decision for a human to make,"
            echo "::error::not something this check can grant on its own."
            exit 1
          fi

      # Catches the half the diff above cannot: a change that moved the path
      # prefix correctly but was still committed as `feat:`, which would ship
      # under a minor bump instead of a major one. This repo squash-merges
      # (see cliff.toml), and the PR title becomes the squashed commit's
      # subject by default, so it stands in for the commit that has not been
      # made yet. check-semantic-pr.yml already enforces the title is a
      # well-formed Conventional Commit; this only checks it is marked
      # breaking, since the diff above already proved it is one.
      - name: Check the PR title marks this as breaking
        if: steps.openapi.outcome == 'failure' || steps.asyncapi.outcome == 'failure'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          if printf '%s' "$PR_TITLE" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
            echo "PR title marks this as a breaking change."
          elif printf '%s' "$PR_BODY" | grep -q 'BREAKING CHANGE:'; then
            echo "PR body carries a BREAKING CHANGE footer."
          else
            echo "::error::The contract diff above is breaking, but the PR title does not mark it as"
            echo "::error::breaking. Use '!' after the type (e.g. 'feat!:') or add a 'BREAKING CHANGE:'"
            echo "::error::footer to the PR body - otherwise git-cliff ships this under a minor bump."
            echo "::error::See AGENTS.md, 'How the contracts are versioned'."
            exit 1
          fi
