---
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded push should not keep the repo-wide lint job running to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: pre-commit/action@v3.0.1

  workflows:
    name: yamllint + actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: yamllint
        # .yamllint lives under firmware/, not at the repo root, so point
        # yamllint at it explicitly rather than relying on upward discovery.
        run: pipx run yamllint -c firmware/.yamllint .github .pre-commit-config.yaml firmware/.yamllint

      - name: actionlint
        uses: raven-actions/actionlint@v2
