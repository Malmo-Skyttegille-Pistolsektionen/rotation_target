---
name: lint

on:
  push:
    branches: [main]
  pull_request:

  # Called by release.yml so the release is gated on the same checks that guard
  # main, run at the exact commit that gets tagged.
  workflow_call:

permissions:
  contents: read

# A superseded run should not keep this going. The group carries a literal
# prefix as well as `github.workflow`, because `github.workflow` is the *caller*
# name when release.yml calls this workflow - without the prefix, two workflows
# called from the same release run would land in one group and cancel each
# other.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14.7'

      # Inlined rather than using pre-commit/action, which is a four-step
      # composite doing exactly this. Upstream describes it as maintenance-only
      # and points at pre-commit.ci instead; meanwhile it pins actions/cache@v4
      # internally, which annotates every pull request in this repository with
      # a Node 20 deprecation notice we cannot address from here.
      #
      # pre-commit.ci is the upstream recommendation and is deliberately not
      # used: it pushes auto-fix commits, and every commit here has to carry a
      # DCO sign-off (CONTRIBUTING.md) that a bot would not add.
      - run: python -m pip install pre-commit

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          # Same key shape as the action used: the hook environments depend on
          # the interpreter as well as the config, so both belong in the key.
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pre-commit run --all-files --show-diff-on-failure --color=always

  workflows:
    name: yamllint + actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false

      - name: yamllint
        # .yamllint lives under firmware/, not at the repo root, so point
        # yamllint at it explicitly rather than relying on upward discovery.
        run: pipx run yamllint -c firmware/.yamllint .github .pre-commit-config.yaml firmware/.yamllint

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

      # actionlint checks each workflow on its own and never compares the two
      # sides of a reusable-workflow call, so it cannot see a caller granting
      # less than the callee asks for. GitHub rejects that when the run starts,
      # with no logs and no job list to diagnose it from - see #213, which took
      # the release workflow out entirely.
      - name: reusable-workflow permissions
        run: python3 .github/scripts/check_workflow_permissions.py

      # The gap no C++ linter can close (#225): clang-tidy and cppcheck analyse
      # translation units, and a file nothing compiles has none. rt_logic lists
      # its sources explicitly - which is right, and is also how
      # `expert_password.{h,cpp}` sat in the tree looking live without ever
      # being built.
      - name: firmware sources are actually built
        run: python3 .github/scripts/check_build_membership.py
