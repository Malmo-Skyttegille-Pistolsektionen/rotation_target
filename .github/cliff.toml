# git-cliff configuration: release notes and the auto-detected version bump.
#
# Used by .github/workflows/release.yml in two ways - `--bumped-version` to work
# out what to release when the `version` input is left empty, and
# `--latest --unreleased` to write the notes the release ships with.
#
# One config, because there is one version: the webapp and the resources are
# baked into the firmware image, so the whole repository releases as a single
# artifact under a single bare-semver tag. See docs/DECISIONS.md D-29.

[changelog]
header = ""
# `striptags` strips the `<!-- N -->` sort prefixes below - without them, groups
# sort alphabetically and Features ends up buried after Bug Fixes.
#
# `remote.pr_number` (the `in #N` below) only resolves for a squash merge -
# git-cliff matches a commit's SHA against a closed PR's merge_commit_sha, never
# true for a real merge commit's constituent commits. This repo squash-merges.
# The `replace` strips GitHub's own auto-appended " (#N)" from a squashed title
# first, using this exact pr_number so it cannot touch an unrelated "(#N)".
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.remote.pr_number %}{{ commit.message | replace(from=" (#" ~ commit.remote.pr_number ~ ")", to="") | upper_first }}{% else %}{{ commit.message | upper_first }}{% endif %}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in #{{ commit.remote.pr_number }}{% endif %}
{% endfor %}
{% endfor %}\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true

commit_parsers = [
  { message = "^[a-z]+\\(ci\\)", skip = true },

  { message = "^security", group = "<!-- 0 -->Security" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^style", group = "<!-- 7 -->Style" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = "^chore", group = "<!-- 9 -->Miscellaneous" },
  { message = "^ci", group = "CI/CD", skip = true },
  # `build:` is deliberately NOT skipped: the firmware's CMake wiring, partition
  # table and LittleFS staging are all `build:` changes that alter the image a
  # user flashes, so they have to reach both the notes and the bump.
  { message = "^build", group = "<!-- 9 -->Miscellaneous" },
]

protect_breaking_commits = true

filter_commits = false
# Bare, full three-part semver - no `v`, no X.Y shorthand. The tag string *is*
# the version the firmware reports (esp_app_desc_t.version) and the version the
# webapp reports, so it has to be a semver value with nothing to strip.
# Anchored at both ends: the obvious "[0-9].*" would also match a stray `2.0` or
# a release candidate and silently make it the boundary the next version is
# computed from.
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "newest"

[bump]
# Left at `false` while the product is below 1.0.0, where a breaking change
# should take the minor rather than jumping to 1.0.0. Above 1.0.0 git-cliff
# bumps the major on a breaking change regardless of this setting.
breaking_always_bump_major = false
