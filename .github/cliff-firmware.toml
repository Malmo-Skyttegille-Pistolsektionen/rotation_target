# git-cliff configuration for firmware releases.
#
# A near-copy of the org default at reqstool/.github `.github/cliff.toml`, which
# every non-monorepo repository uses as-is. Kept locally for one reason: that
# config's `tag_pattern` matches bare `X.Y.Z` tags, and this repository releases
# three components off one history, so the firmware's tag line has to be
# selected by prefix. Keep the rest in step with the org copy.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.remote.pr_number %}{{ commit.message | replace(from=" (#" ~ commit.remote.pr_number ~ ")", to="") | upper_first }}{% else %}{{ commit.message | upper_first }}{% endif %}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in #{{ commit.remote.pr_number }}{% endif %}
{% endfor %}
{% endfor %}\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true

commit_parsers = [
  { message = "^[a-z]+\\(ci\\)", skip = true },

  { message = "^security", group = "<!-- 0 -->Security" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^style", group = "<!-- 7 -->Style" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = "^chore", group = "<!-- 9 -->Miscellaneous" },
  { message = "^ci", group = "CI/CD", skip = true },
  # Unlike the org copy, `build:` is NOT skipped: the firmware's CMake wiring,
  # partition table and LittleFS staging are all `build:` changes that alter the
  # image a user flashes, so they have to reach both the notes and the bump.
  { message = "^build", group = "<!-- 9 -->Miscellaneous" },
]

protect_breaking_commits = true

filter_commits = false
# The firmware's own tag line. Anchored at both ends so a release candidate does
# not become the boundary the next version is computed from.
tag_pattern = "^firmware-v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "newest"

[bump]
breaking_always_bump_major = false
# Without this the very first release fails: git-cliff proposes a bare `0.1.0`
# with no tag to take the prefix from, then rejects it against tag_pattern.
initial_tag = "firmware-v0.1.0"
