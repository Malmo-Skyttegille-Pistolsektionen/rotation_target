# yaml-language-server: $schema=https://raw.githubusercontent.com/asyncapi/spec-json-schemas/refs/heads/master/schemas/3.1.0.json
---
asyncapi: 3.1.0

info:
  title: Rotation target SSE v2
  version: 3.1.1
  license:
    name: MIT
  description: |
    The Server-Sent Events stream the rotation target firmware serves at
    `/sse/v2`, alongside the REST API specified in `contracts/openapi.yaml`.

    This document is **canonical** and is written from the implementation
    (`firmware/main/net/sse_hub.cpp` and
    `firmware/lib/rt_logic/program_state.h`). See `contracts/README.md`.

    ## Why the stream exists

    There is no `GET /status` in API v2. `stateUpdate` is the only channel run
    state is published on, and it is the reason no status endpoint is needed:
    a client connects, is sent the full current state immediately, and is sent
    it again after every change.

    `backend_issue` covers the other direction: a failure the device noticed
    on its own, which no REST response can carry because no client asked for
    it. A clip that will not play and a program file that will not parse are
    both invisible to a client otherwise — the run simply carries on, quietly
    wrong.

    `libraryChanged` covers the third: the stored programs and audio clips are
    fetched over REST, not published here, so a client that did not make the
    change had no way to learn of it. On a range with a laptop and a phone
    both open, the second one showed a stale list until somebody reloaded it.

    ## Connection behaviour

    - `GET /sse/v2` answers `200` with `Content-Type: text/event-stream`,
      `Cache-Control: no-cache` and `Connection: keep-alive`. The CORS
      headers described in the OpenAPI document apply here too.
    - On connect, before anything else, the server sends one `stateUpdate`
      carrying the full current state, with `retry: 500` — so a browser
      `EventSource` reconnects half a second after a drop. Later frames carry
      no `retry`.
    - Every frame carries an `id:` field: the device's uptime in
      milliseconds. It is a monotonic ordering hint, not a resumption cursor
      — a client's `Last-Event-ID` is read on reconnect but nothing is
      replayed from it, and the fresh `stateUpdate` on connect makes replay
      unnecessary.
    - A `heartbeat` follows every 10 seconds
      (`kSseHeartbeatSeconds`, `firmware/main/config.h`), whether or not
      anything changed.
    - `libraryChanged` is emitted when a REST call changes what
      `GET /api/v2/programs` or `GET /api/v2/audios` would return, and is
      **fire-and-forget** on the same terms as `backend_issue` below: nothing
      is buffered for a client that connects later and nothing is replayed on
      reconnect. A client that was not listening does not need it — it fetches
      both lists on connect anyway.
    - `backend_issue` is emitted only when something fails, and is
      **fire-and-forget**: it is delivered to whoever is connected at that
      instant and to nobody else. Nothing is buffered for a client that
      connects later, nothing is replayed on reconnect, and there is no
      endpoint that lists past issues. A client that was not listening did
      not hear it — the device log is the record, the event is the
      notification. Issues raised during boot, before the HTTP server
      exists, reach no client on this stream at all; those are kept instead
      and served by `GET /api/v2/diagnostics/info` as `startupIssues`, the
      one exception to "no endpoint lists past issues".
    - The stream is one-way and public: no credential is required, and
      nothing a client sends on it is read.

    ## Delivery guarantees

    State is serialized *and* queued under a single lock, and the frames are
    then written from the HTTP task, so the order clients see is the order the
    state actually took. If the HTTP work queue is full — the task wedged or
    badly behind — a frame is **dropped** rather than blocking the run loop,
    so a client may miss an intermediate state. It will not miss the final
    one for long: the next mutation or the next connect republishes.

    Dead clients are reaped on the heartbeat cadence: a peer that closed
    cleanly is detected by a non-destructive peek, and TCP keepalive
    (30 s idle, 10 s interval, 3 probes) catches a peer that vanished without
    a FIN.

    ## Sockets

    The server keeps at most 12 sockets open, and every connected client holds
    one of them for this stream on top of its REST traffic.

servers:
  device:
    host: rotation-target.local
    protocol: http
    description: >-
      The device on the range network, by mDNS name. Hostname from
      `CONFIG_RT_HOSTNAME`, port from `CONFIG_RT_HTTP_PORT` (default 80).
  qemu:
    host: localhost:8080
    protocol: http
    description: The firmware under QEMU, through the host-forwarded port.

defaultContentType: application/json

channels:
  events:
    address: /sse/v2
    title: Run-state stream
    description: >-
      The single SSE channel. Every message is named by the SSE `event:`
      field; its payload is the `data:` line.
    servers:
      - $ref: "#/servers/device"
      - $ref: "#/servers/qemu"
    messages:
      stateUpdate:
        $ref: "#/components/messages/stateUpdate"
      heartbeat:
        $ref: "#/components/messages/heartbeat"
      backend_issue:
        $ref: "#/components/messages/backendIssue"
      libraryChanged:
        $ref: "#/components/messages/libraryChanged"

operations:
  receiveEvents:
    action: receive
    channel:
      $ref: "#/channels/events"
    title: Receive run-state events
    summary: >-
      Subscribe with an `EventSource` (or any SSE client) and follow the run.
    messages:
      - $ref: "#/channels/events/messages/stateUpdate"
      - $ref: "#/channels/events/messages/heartbeat"
      - $ref: "#/channels/events/messages/backend_issue"
      - $ref: "#/channels/events/messages/libraryChanged"

components:
  messages:
    stateUpdate:
      name: stateUpdate
      title: Full run state
      summary: >-
        Sent once on connect and again after every change: load, start, stop,
        reset, skip, a target move, an event boundary during a run, and the
        deletion of the loaded program.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/StateUpdate"
      examples:
        - name: running
          summary: A program part-way through its first series.
          payload:
            loadedProgramId: 1
            programState:
              running: true
              currentSeriesIndex: 0
              currentEventIndex: 2
              tickerMs: 7480
            targetStatus: shown
        - name: loaded-not-started
          summary: >-
            Just after `load`: series and event selected, ticker still unset.
          payload:
            loadedProgramId: 20
            programState:
              running: false
              currentSeriesIndex: 0
              currentEventIndex: 0
              tickerMs: null
            targetStatus: hidden
        - name: nothing-loaded
          summary: The state at boot, and after the loaded program is deleted.
          payload:
            loadedProgramId: null
            programState: null
            targetStatus: hidden

    heartbeat:
      name: heartbeat
      title: Keepalive
      summary: >-
        Emitted every 10 seconds regardless of activity. A client can watch
        `id` for a gap to spot a missed beat, and treat a missing heartbeat as
        a dead connection.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/Heartbeat"
      examples:
        - name: beat
          payload:
            id: 42

    backendIssue:
      name: backend_issue
      title: Device-side failure
      summary: >-
        Something failed that no request will report: an audio clip that could
        not be played, a stored program file that could not be parsed. Emitted
        only when it happens, and only to clients connected at that moment.
      description: |
        The event exists so a failure the device notices on its own reaches
        the range rather than only the serial log. It is **advisory**: run
        state is unaffected, `stateUpdate` is not re-sent because of it, and a
        client that ignores the event behaves exactly as it did before.

        `code` is what a client switches on and is stable; `message` is
        English prose for a human and may be reworded in any release.
        `context` carries whatever identifies the thing that failed and its
        keys differ per `code` — a client reads a key it knows or shows
        nothing.

        Unknown `code` values must be tolerated: a later firmware may report a
        failure this document does not list, and the enum below is what the
        firmware in this repository emits today, not a closed set for all
        time.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/BackendIssue"
      examples:
        - name: clip-will-not-play
          summary: >-
            The WAV attached to the event the run just entered is missing from
            the filesystem. The run continues; the start signal is silent.
          payload:
            code: audio_playback_failed
            message: Audio clip could not be opened
            context:
              clip: /storage/audio/50.wav
        - name: clip-is-not-a-wav
          summary: An uploaded file that the WAV header parser rejects.
          payload:
            code: audio_playback_failed
            message: Audio clip is not a playable WAV
            context:
              clip: /storage/uploads/audio/103.wav
        - name: program-will-not-parse
          summary: >-
            A stored program file skipped by the boot scan, so the program is
            absent from `GET /api/v2/programs`.
          payload:
            code: program_invalid
            message: Program file is malformed and was skipped
            context:
              file: /storage/uploads/programs/20.json

    libraryChanged:
      name: libraryChanged
      title: The stored library changed
      summary: >-
        A program or an audio clip was created, replaced or deleted. Refetch
        the list `kind` names; nothing else about the device has changed.
      description: |
        Programs and audio clips are fetched over REST — `GET /api/v2/programs`
        and `GET /api/v2/audios` — so before this event a client only knew
        about the changes it made itself. Every other client kept showing the
        list it last fetched, which at a range with a laptop and a phone open
        is a program that has been uploaded but cannot be found.

        The payload deliberately carries **no id and no operation**: this is a
        cache-invalidation signal, not a delta. The client re-issues the GET it
        would have made anyway and the device stays the single source of truth,
        which is the same reason `stateUpdate` sends the whole state rather
        than a diff. `kind` is there only so a client refetches one list
        instead of both.

        **Run state is not library state.** `load`, `start`, `stop`, `reset`,
        `skip_to` and `unload` change what the device is *doing*, not what it
        *stores*, and are published as `stateUpdate`. Deleting the loaded
        program emits both: `libraryChanged` because a program is gone, and
        `stateUpdate` because nothing is loaded any more.

        Advisory, like `backend_issue`: a client that ignores it behaves
        exactly as it did before — stale, but correct in everything else.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/LibraryChanged"
      examples:
        - name: program-uploaded
          summary: >-
            After `POST /api/v2/programs`, `PUT /api/v2/programs/{id}` or
            `DELETE /api/v2/programs/{id}/delete`.
          payload:
            kind: program
        - name: clip-deleted
          summary: >-
            After `POST /api/v2/audios` (upload) or
            `DELETE /api/v2/audios/{id}/delete`.
          payload:
            kind: audio

  schemas:
    StateUpdate:
      type: object
      required: [loadedProgramId, programState, targetStatus]
      additionalProperties: false
      properties:
        loadedProgramId:
          type: [integer, "null"]
          format: int32
          description: The selected program's id, or `null` when nothing is loaded.
        programState:
          description: >-
            `null` exactly when `loadedProgramId` is `null` — the two are
            emitted from the same condition, so a client may test either.
          oneOf:
            - $ref: "#/components/schemas/ProgramState"
            - type: "null"
        targetStatus:
          type: string
          enum: [shown, hidden]
          description: >-
            Where the targets are. Always present, including when nothing is
            loaded: the targets can be moved outside a program run.

    ProgramState:
      type: object
      required:
        - running
        - currentSeriesIndex
        - currentEventIndex
        - tickerMs
      additionalProperties: false
      description: >-
        The three indices are nullable on the wire and are `null` rather than
        `-1` when unset. All three keys are always present.
      properties:
        running:
          type: boolean
        currentSeriesIndex:
          type: [integer, "null"]
          format: int32
          minimum: 0
          description: >-
            Zero-based index into the loaded program's `series`. Set by
            `load` (to 0) and by `skip_to`; `null` only in states where no
            series is selected.
        currentEventIndex:
          type: [integer, "null"]
          format: int32
          minimum: 0
          description: >-
            Zero-based index into the current series' `events`. Derived from
            elapsed series time rather than tracked per event, so a paused run
            resumes at whatever event `tickerMs` lands in.
        tickerMs:
          type: [integer, "null"]
          format: int32
          minimum: 0
          description: |
            Milliseconds elapsed in the current series, and also the resume
            point: `stop` keeps it, `reset` and `skip_to` clear it, `load`
            leaves it unset.

            **Sent at millisecond precision, not at millisecond cadence.** A
            frame goes out once a second and on every event boundary, exactly
            as before; what changed is that the value carries the sub-second
            part instead of discarding it, so a client's playhead lands where
            the run actually is rather than up to a second behind.

            Replaced `tickerSeconds` in contract version 3.0.0 — see D-16 in
            `docs/DECISIONS.md`. Whole seconds are a client-side derivation
            (`Math.floor(tickerMs / 1000)`); the retired MicroPython backend
            still emits the old field, and `contracts/history/` records it.

    BackendIssue:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            The machine-readable identifier. The list below is **open**: it is
            what the firmware in this repository emits today, not a closed set
            for all time, and a client must tolerate a value it has never seen.
            That is why it is `x-extensible-enum` and not `enum` — a generator
            reading `enum` would emit a closed union and a later firmware's
            code would fail validation at the client.

            - `audio_playback_failed` — a clip queued by the run loop could
              not be opened, was not a playable WAV, or the I2S output could
              not be configured for it. Raised from the playback task, so it
              can arrive at any point during a run. The run is unaffected;
              that event is simply silent.
            - `program_invalid` — a file in a program directory could not be
              read or did not parse, and was skipped, so the program is absent
              from `GET /api/v2/programs`. Raised by the boot scan, which runs
              before the HTTP server exists, so no client ever receives it on
              this stream: it is served by `GET /api/v2/diagnostics/info` as
              `startupIssues` instead. The code is specified here because the
              payload is the same and a rescan added later would emit it.

            `program_invalid` is also a REST problem type,
            `/problems/program_invalid` in `openapi.yaml` — one failure, one
            word, whichever channel reports it (D-19). Rename it in one place
            and `host_test/test_problem` fails.
          x-extensible-enum:
            - audio_playback_failed
            - program_invalid
        message:
          type: string
          description: >-
            English prose describing the failure, suitable for a toast. Not
            stable across releases and not to be parsed.
        context:
          type: object
          description: >-
            What failed. Present whenever the emitter has something to name;
            absent otherwise. Keys depend on `code` and more may be added, so
            read the ones you know and ignore the rest.
          additionalProperties:
            type: string
          properties:
            clip:
              type: string
              description: >-
                `audio_playback_failed`: the clip's path on the device
                filesystem, which is the same value `GET /api/v2/audios`
                reports as `filename`.
            file:
              type: string
              description: >-
                `program_invalid`: the program file's path on the device
                filesystem.

    LibraryChanged:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: |
            Which stored collection to refetch.

            - `program` — `GET /api/v2/programs`. Emitted after a create, a
              replace or a delete.
            - `audio` — `GET /api/v2/audios`. Emitted after an upload or a
              delete.

            A closed `enum`, unlike `backend_issue`'s `code`: it enumerates the
            library collections this API has, so gaining a third one means
            gaining REST endpoints and a new version of this document, not a
            firmware quietly emitting a value nobody specified. A client should
            still ignore a `kind` it does not recognise rather than refetch
            everything.
          enum: [audio, program]

    Heartbeat:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
          description: >-
            A counter incremented per beat, starting at 1 and reset by a
            reboot. Unrelated to the SSE `id:` field, which carries uptime in
            milliseconds.
