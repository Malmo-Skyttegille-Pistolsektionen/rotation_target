# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2022-10-07
---
openapi: 3.1.0

info:
  title: Rotation target REST API v2
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    The REST API the rotation target firmware serves under `/api/v2`, together
    with the SSE stream at `/sse/v2` (specified separately in
    `contracts/asyncapi.yaml`).

    This document is **canonical** and is written from the implementation
    (`firmware/main/net/web_server.cpp` and `firmware/lib/rt_logic/`), not the
    other way round. Where prose documentation and the firmware disagree, the
    firmware wins and this file follows it. See `contracts/README.md`.

    ## State model

    There is no `GET /status`. Run state is published only over `/sse/v2`: a
    client connects, immediately receives a full `stateUpdate`, and receives
    another after every mutation. The mutating endpoints here answer with a
    short confirmation message, not with state.

    ## Errors

    Every failure is an **RFC 9457 problem detail** served as
    `application/problem+json` (D-19):

    ```json
    {
      "type": "/problems/program_readonly",
      "title": "Program is read-only",
      "status": 409,
      "detail": "Program is read-only and cannot be deleted"
    }
    ```

    `type` is the discriminator — a **stable relative URI that is never
    dereferenced**, and the only member a client should branch on. `title` is
    short and identical for every occurrence of a type; `detail` describes the
    one occurrence and is the string to show a user. `instance` is omitted:
    it identifies a single occurrence and the device has no request ids.

    One status per `type`, always — so the `type` lists under each operation
    below say exactly what a given status code can mean there.

    The slug vocabulary is **shared with the SSE `backend_issue` codes** in
    `contracts/asyncapi.yaml`: a program that will not parse is
    `/problems/program_invalid` over REST and `program_invalid` over SSE,
    because it is the same failure. The full list is the `enum` on
    `Problem.type`.

    A client must tolerate a `type` it does not recognise — fall back to
    `status` and show `detail`. New types are additive.

    ## Authentication

    Admin mode is off after every boot and lives in RAM only. While it is off,
    **every endpoint is unauthenticated**, including the ones marked as
    requiring an admin session below. A client turns protection on with
    `POST /api/v2/admin-mode/enable`, choosing the password in that call.

    While admin mode is on, the protected endpoints accept either credential:

    - `Authorization: Bearer <token>`
    - `Cookie: admin=<token>`

    The header is checked first; the cookie is the fallback. Tokens are 16
    random bytes, hex-encoded, valid for 12 hours from issue, and at most 8
    are held at once (oldest evicted first). `enable` and `login` return the
    token in the body *and* set it as
    `Set-Cookie: admin=<token>; Path=/; SameSite=Lax` — deliberately not
    `HttpOnly`, because the webapp reads it back. `SameSite=Lax` means the
    cookie only rides along when the webapp is served from the device itself;
    a webapp on another origin authenticates with the bearer token.

    Because of the "off means open" rule, each protected operation lists an
    empty security requirement alongside the two credentials: with admin mode
    disabled, a call with no credentials succeeds.

    ## CORS

    The firmware answers credentialed cross-origin requests against an
    allowlist rather than with `*` (a browser refuses a wildcard on a
    credentialed request). An `Origin` header is echoed back in
    `Access-Control-Allow-Origin`, with `Access-Control-Allow-Credentials:
    true`, `Access-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS`,
    `Access-Control-Allow-Headers: Authorization, Content-Type`,
    `Access-Control-Max-Age: 600` and `Vary: Origin`, only when it is one of:

    - `http(s)://<CONFIG_RT_HOSTNAME>.local` (default `rotation-target.local`)
    - `http(s)://<the device's current IP>`
    - `CONFIG_RT_DEV_ORIGIN`, when that Kconfig value is non-empty

    Any other origin gets no CORS headers at all, so the browser blocks the
    response.

    ## Routes that exist but are not modelled as paths here

    Both are catch-alls that would have to be attached to every path to be
    modelled honestly, so they are recorded here instead:

    - `OPTIONS /*` — a single catch-all preflight handler answering `204` with
      no body (with the CORS headers above when the origin is allowed).
      Registered because nothing else answers `OPTIONS`, and a preflight that
      404s fails the real request behind it.
    - `GET /*` — the built webapp, served from the LittleFS path
      `/storage/webapp/` with `index.html` as the default file. Registered
      last so it can never shadow an API route.

    An unmatched URI answers `404` with `/problems/route_not_found`.

    Provisioning (the SoftAP setup portal at `/` and `/save`) runs on a
    *separate* HTTP server that is only up when the device has no WiFi
    credentials. It is not part of this API.

    ## Limits

    - Request bodies and uploads are capped at 1 MiB (`kMaxUploadBytes`,
      `firmware/main/config.h`). Exceeding it is answered `400` with a
      **`text/html`** body, not a problem detail — that check lives in the
      vendored HTTP layer, above every handler, and is the one failure in this
      API that is not RFC 9457.
    - At most 12 sockets are open at once, and each connected client holds one
      of them for `/sse/v2` on top of its REST traffic.

servers:
  - url: http://rotation-target.local/api/v2
    description: >-
      The device on the range network, by mDNS name. The hostname is
      `CONFIG_RT_HOSTNAME` and the port `CONFIG_RT_HTTP_PORT` (default 80).
  - url: http://localhost:8080/api/v2
    description: >-
      The firmware under QEMU, reached through the host-forwarded port.

security:
  - {}

tags:
  - name: version
    description: Firmware identity.
  - name: diagnostics
    description: Post-incident triage without a USB cable.
  - name: admin-mode
    description: Turning write protection on and off, and session handling.
  - name: programs
    description: The stored programs and the run control that drives them.
  - name: targets
    description: Direct target control, outside a program run.
  - name: audios
    description: The stored audio clips.
  - name: config
    description: >-
      Hardware the device can be told about without rebuilding it: which pin
      drives the targets, which way round it is wired, and what it calls
      itself.
  - name: sse
    description: The event stream carrying run state.

paths:
  /version:
    get:
      tags: [version]
      summary: Firmware version
      operationId: getVersion
      description: |
        The three-part split of the firmware version, which is derived from
        `git describe` at build time. A describe output that is not a
        three-part semver — an untagged build, for instance — reports
        `0.0.0` rather than inventing a version from the hash.
      responses:
        "200":
          description: The running firmware version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /diagnostics/info:
    get:
      tags: [diagnostics]
      summary: Firmware identity and health
      operationId: getDiagnosticsInfo
      description: |
        Public, like every other `GET`: it carries no credential and no
        program data, only the firmware's own identity and health.

        The coredump itself is deliberately **not** exposed — it is a raw RAM
        snapshot and can contain the WiFi password, so retrieving one stays an
        out-of-band job needing physical access. `coredumpPresent` only says
        whether there is something to go and fetch.

        `startupIssues` is the one field here that is not a health counter: it
        is the set of `backend_issue` events the device raised before this
        server existed, which the SSE stream could not deliver to anybody. A
        client that wants to know whether a stored program failed to load has
        to ask for them; nothing pushes them.
      responses:
        "200":
          description: A health snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsInfo"

  /admin-mode/status:
    get:
      tags: [admin-mode]
      summary: Whether admin mode is on
      operationId: getAdminModeStatus
      responses:
        "200":
          description: Whether write protection is currently enabled.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
                additionalProperties: false

  /admin-mode/enable:
    post:
      tags: [admin-mode]
      summary: Turn admin mode on and open a session
      operationId: enableAdminMode
      description: |
        Sets the password — any non-empty string, chosen by this call — and
        returns the first session token. Refused while admin mode is already
        on: log in or disable it first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordBody"
      responses:
        "200":
          $ref: "#/components/responses/AdminSession"
        "401":
          description: |
            - `/problems/invalid_password` — the password was empty, or the
              body carried none.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            - `/problems/admin_mode_already_enabled` — log in or disable it
              first.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin-mode/login:
    post:
      tags: [admin-mode]
      summary: Open another session with the active password
      operationId: loginAdminMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordBody"
      responses:
        "200":
          $ref: "#/components/responses/AdminSession"
        "401":
          description: |
            - `/problems/invalid_password` — wrong password.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            - `/problems/admin_mode_not_enabled` — there is nothing to log in
              to.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin-mode/logout:
    post:
      tags: [admin-mode]
      summary: Invalidate the presenting session
      operationId: logoutAdminMode
      description: |
        Ends this session only, leaving admin mode on — which is what a client
        walking away from a shared range laptop wants, and the opposite of
        `disable`.

        The token is taken from the `Authorization` header, falling back to
        the `admin` cookie. **This endpoint is not itself protected**: it
        always answers `200` and always clears the cookie, whether or not the
        presented token was a live session (or was presented at all).
      responses:
        "200":
          description: >-
            Logged out. `Set-Cookie: admin=; Path=/; SameSite=Lax; Max-Age=0`
            clears the cookie.
          headers:
            Set-Cookie:
              description: Clears the `admin` cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /admin-mode/disable:
    post:
      tags: [admin-mode]
      summary: Turn admin mode off
      operationId: disableAdminMode
      description: |
        Clears the password and invalidates every issued token. Note this
        turns protection *off* — every endpoint becomes writable by anyone on
        the network again. It is not "log out"; see `/admin-mode/logout`.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: Admin mode disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs:
    get:
      tags: [programs]
      summary: List the stored programs
      operationId: listPrograms
      description: Summaries only — the series are omitted. Ordered by id ascending.
      responses:
        "200":
          description: Every program the device holds, shipped and uploaded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProgramSummary"
    post:
      tags: [programs]
      summary: Upload a program
      operationId: createProgram
      description: |
        The `id` in the uploaded document is **ignored**: the device assigns
        the next free id from 100 upwards and rewrites the file from the
        parsed program, so what is persisted is what will come back on the
        next boot. `readonly` in the document is ignored too — it follows from
        the directory the program lives in, and an upload is never read-only.

        Unknown fields are dropped, and `duration` is clamped to
        1…3600000 ms per event. Posting a document carrying an existing id
        creates a *new* program; replacing one is `PUT /programs/{id}`.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      requestBody:
        required: true
        description: A program document; see `contracts/program.schema.json`.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Program"
      responses:
        "201":
          description: Stored. The body carries the assigned id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedId"
        "400":
          description: |
            - `/problems/program_invalid` — empty body, malformed JSON, or a
              non-object root.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/{id}:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    get:
      tags: [programs]
      summary: Fetch one program in full
      operationId: getProgram
      responses:
        "200":
          description: The program, series and events included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: |
            - `/problems/program_not_found` — no such program, or a path
              segment that is not a plain decimal integer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags: [programs]
      summary: Replace an uploaded program
      operationId: updateProgram
      description: |
        Replaces the stored document for `{id}` with the body, parsed and
        validated exactly as `POST /programs` parses an upload and rewritten
        from the parsed model — so unknown fields are dropped, `duration` is
        clamped to 1…3600000 ms per event, and `readonly` in the body is
        ignored. The response is the stored form, identical to what
        `GET /programs/{id}` returns afterwards.

        The id never moves: `{id}` in the path is the authority, matching the
        filename the program is stored under. A body carrying an `id` other
        than `{id}` is a `400` rather than a rename or a renumbering; a body
        with no `id` (or `id: null`) is accepted and keeps `{id}`.

        **The program must not be loaded.** Run state holds a pointer into the
        stored program, so replacing a loaded one would swap the series out
        from beneath a run in progress and beneath the indices already
        published over `stateUpdate`. The client calls
        `POST /programs/unload` (or loads something else) first; there is no
        forced-update flag.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      requestBody:
        required: true
        description: >-
          A program document; see `contracts/program.schema.json`. `id` may be
          omitted, and `readonly` is ignored.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgramUpdate"
      responses:
        "200":
          description: Replaced. The body is the program as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "400":
          description: |
            - `/problems/program_invalid` — empty body, malformed JSON, or a
              non-object root.
            - `/problems/program_id_mismatch` — the body declares a different
              id from the path.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            - `/problems/program_not_found` — no such program, or a path
              segment that is not a plain decimal integer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            - `/problems/program_readonly` — the program is shipped with the
              firmware and has no writable file behind it. Upload the document
              as a new program instead.
            - `/problems/program_loaded` — it is the loaded program.
              `POST /programs/unload` first.

            The same status for two refusals a client must answer differently
            is why `type` exists (D-19): the wording of `detail` is not a
            discriminator.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: |
            - `/problems/program_store_failed` — the replacement could not be
              written to flash. The previous document is left intact.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /programs/{id}/load:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    post:
      tags: [programs]
      summary: Select a program to run
      operationId: loadProgram
      description: >-
        Selects the program at series 0, event 0, with `tickerMs` unset.
        Does not start it.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: Program loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            - `/problems/program_not_found` — no such program.
            - `/problems/route_not_found` — the path did not parse.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /programs/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/ProgramId"
    delete:
      tags: [programs]
      summary: Delete an uploaded program
      operationId: deleteProgram
      description: |
        Shipped programs are read-only and answer `409`, the same refusal
        `PUT /programs/{id}` gives for the same program — a program that does
        not exist is the `404`. Deletability is checked before anything is
        unloaded, so a refused delete never disturbs a run in progress. If the
        program being deleted is the loaded one, it is unloaded first
        (whatever the run state — see `POST /programs/unload`) and a
        `stateUpdate` follows.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: Program deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            - `/problems/program_not_found` — no such program.
            - `/problems/route_not_found` — the path did not parse.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            - `/problems/program_readonly` — the program is shipped with the
              firmware and has no writable file behind it. The same type
              `PUT /programs/{id}` answers for the same program.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /programs/start:
    post:
      tags: [programs]
      summary: Start the named program, if it is the one loaded
      operationId: startProgram
      description: |
        Resumes the current series from `tickerMs`, or runs it from zero
        when the ticker is unset. Starting an already-running program is a
        no-op and still answers `200`. Audio only replays when the resume
        point lands exactly on an event boundary.

        The body names the program the caller decided to start, and the device
        refuses with `409` if it holds a different one (D-27). The id is
        **required**: an id-less start asks the device to run whatever it
        happens to hold at that instant, which is the ambiguity this closes.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "200":
          description: Program started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: |
            - `/problems/no_program_loaded` — nothing is loaded, or the loaded
              program has no series at the current index.
            - `/problems/start_id_required` — no body, unparseable JSON, or no
              integer `id`.

            "Nothing is loaded" outranks the id check: it is the more precise
            diagnosis, and it is what a client that has to load something first
            needs to hear.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            - `/problems/start_program_mismatch` — a different program is
              loaded. `detail` names both ids, because the operator needs to
              know what the device actually holds to decide what to do about
              it. The run state is untouched and no `stateUpdate` is published.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /programs/stop:
    post:
      tags: [programs]
      summary: Pause the running program
      operationId: stopProgram
      description: >-
        Pauses and keeps the last published position, so `start` resumes
        from it. That is the ticker the last `stateUpdate` carried, not the
        instant the pause arrived. Since `asyncapi.yaml` 3.0.0 replaced the
        whole-second `tickerSeconds` with `tickerMs`, a pause a few hundred
        milliseconds into a series no longer rewinds to the start of it.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: Program paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: |
            - `/problems/program_not_running` — nothing is running.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/reset:
    post:
      tags: [programs]
      summary: Rewind to the start of the current series
      operationId: resetProgram
      description: >-
        Stops the run, selects event 0 of the current series and clears
        `tickerMs`. The selected series is kept.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: Program reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: |
            - `/problems/no_program_loaded` — nothing is loaded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /programs/unload:
    post:
      tags: [programs]
      summary: Clear the loaded program
      operationId: unloadProgram
      description: |
        Clears the selection and publishes a `stateUpdate` carrying
        `loadedProgramId: null` and `programState: null`. The targets are left
        exactly where the run left them — unloading moves no hardware.

        **Refused while a run is in progress** (`409`): unloading is
        bookkeeping, and a call that reads as bookkeeping must not end a series
        mid-range. `stop` first — it is a pause, so the refusal lifts with it.

        **Idempotent.** Unloading when nothing is loaded is `200` with the same
        message; no `stateUpdate` follows, because it would repeat the one
        clients already hold. So a `200` means "nothing is loaded now", not
        "something was unloaded just now" — the two are not distinguishable,
        deliberately.

        This is the escape from the `409` that `PUT /programs/{id}` and
        `DELETE /audios/{id}/delete` point at when the program that blocks them
        is the loaded one.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: >-
            Nothing is loaded. Either it was just unloaded (a `stateUpdate`
            follows) or nothing was loaded to begin with (none does).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: |
            - `/problems/program_running` — a run is in progress. `stop` first;
              it is a pause, so the refusal lifts with it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /programs/series/{seriesIndex}/skip_to:
    parameters:
      - name: seriesIndex
        in: path
        required: true
        description: >-
          Zero-based index into the loaded program's `series`. Must be a plain
          decimal integer; anything else is a `404`.
        schema:
          type: integer
          format: int32
          minimum: 0
    post:
      tags: [programs]
      summary: Jump to a series, if it belongs to the program loaded
      operationId: skipToSeries
      description: |
        Stops the run and selects the series, paused at its first event with
        `tickerMs` cleared.

        The body names the program the caller decided the index was for, and
        the device refuses with `409` if it holds a different one — the same
        rule `POST /programs/start` applies (D-27), extended here because
        `skip_to` is what decides where the next `start` begins (#105). The id
        is **required**, for the same reason it is on `start`: an id-less skip
        would keep a way to select a series of whatever the device happens to
        hold.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipRequest"
      responses:
        "200":
          description: "Skipped to series <index>."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: |
            - `/problems/series_index_invalid` — nothing is loaded, or the
              index is outside the loaded program. The firmware does not
              distinguish the two. Unchanged by #105: it is checked after the
              id, but stays a `400` either way.
            - `/problems/skip_id_required` — no body, unparseable JSON, or no
              integer `id`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            - `/problems/route_not_found` — the path segment is not a plain
              decimal integer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            - `/problems/skip_program_mismatch` — a different program is
              loaded. `detail` names both ids, same reasoning as `start`'s
              `409`. The run state is untouched and no `stateUpdate` is
              published.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /targets/show:
    post:
      tags: [targets]
      summary: Turn the targets face-on
      operationId: showTargets
      description: >-
        Drives the target hardware directly. It does not stop a running
        program, which will move the targets again at its next event
        boundary.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: Targets shown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /targets/hide:
    post:
      tags: [targets]
      summary: Turn the targets edge-on
      operationId: hideTargets
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: Targets hidden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /targets/toggle:
    post:
      tags: [targets]
      summary: Flip the targets
      operationId: toggleTargets
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: >-
            The resulting state, as `Targets shown` or `Targets hidden`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /config/hardware:
    get:
      tags: [config]
      summary: The hardware this device is configured for
      operationId: getHardwareConfig
      description: |
        Public, like every other `GET`: it carries no credential, and the pin a
        device drives is not a secret from anyone who can already see the
        device.

        Reports the configuration **in force**, which is the one latched at
        boot — not one saved since. A write takes effect at the next restart
        (see `PUT`), so `saved` and `active` differ exactly between a save and
        that restart, and a client that shows only one of them will tell an
        operator their change did nothing.

        `defaults` is what the firmware was compiled with, so a client can mark
        which values have been overridden and offer to put them back without
        knowing what the compiled values are.
      responses:
        "200":
          description: The active configuration, what is stored, and the compiled defaults.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareConfigState"

    put:
      tags: [config]
      summary: Store a hardware configuration
      operationId: putHardwareConfig
      description: |
        Validates, then persists to NVS. **Takes effect at the next restart**,
        and the response says so: nothing here re-drives a pin or renames mDNS
        in place, because a target GPIO that moved while a program was loaded
        would leave the old pin latched in whatever state it was last driven
        to.

        Refused as a whole on a bad value — nothing is written, so a rejected
        form leaves the device exactly as it was. The refusals are the ones
        whose recovery needs a USB cable:

        - a GPIO outside 0–48, or one absent from this chip (22–25)
        - a GPIO wired to the module's own flash or PSRAM (26–32), which stops
          the device booting rather than merely failing to drive a target
        - a GPIO that cannot drive an output
        - a hostname that is not a legal DNS label, since it is also the setup
          access point's SSID prefix

        `targetsShownAtBoot` is refused outright, whatever its value: it is
        serial-only (D-31). Refused rather than ignored, because an operator
        who believes they changed where the targets rest is worse off than one
        who was told they could not.

        Survives a firmware update: `idf.py flash` leaves the `nvs` partition
        alone, so a club's configuration outlives the image it was set on.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HardwareConfigPatch"
      responses:
        "200":
          description: Stored. Applies at the next restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: |
            - `/problems/hardware_config_invalid` — a value the device refuses.
              `detail` names which and why, because the operator has to decide
              what to type instead.
            - `/problems/hardware_config_serial_only` — the body carried
              `targetsShownAtBoot`, which changes only from the serial console.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `/problems/hardware_config_window_closed` — nobody has pressed the
            device's button recently, so the configuration window is shut.

            Separate from 401, which is about admin credentials: this is not a
            question of who you are but of whether somebody is standing at the
            device. Both apply, and both must pass.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /config/hardware/reset:
    post:
      tags: [config]
      summary: Forget the stored configuration
      operationId: resetHardwareConfig
      description: |
        Drops every override so the next boot comes up on the compiled
        defaults. The way back from a configuration that does not suit the
        board — though reaching this over HTTP assumes the device is still
        reachable, which a wrong pin does not prevent but a wrong hostname
        might.

        Leaves the WiFi credentials alone. They share an NVS namespace with
        this, and taking them out would turn "undo my hardware change" into
        "and now find the setup portal".
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: Cleared. Applies at the next restart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /ota:
    post:
      tags: [diagnostics]
      summary: Upload new firmware
      operationId: uploadFirmware
      description: |
        A `multipart/form-data` body with one file part: an ESP-IDF
        application image (`rotation_target_backend.bin`).

        The image is streamed into the **inactive** app slot, so the running
        firmware is never overwritten. Once it has landed the device compares
        the image's `project_name` against its own and refuses anything that
        is not this project — secure boot is off, so that check is the only
        thing between an admin session and arbitrary firmware. A refused image
        is aborted rather than finalised, so it is never the boot partition
        even for an instant.

        On success the device answers `200` and **restarts about 1.5 seconds
        later** — long enough for this response to reach the client. The client
        should expect the connection to drop and the device to be briefly
        unreachable.

        **Rollback is automatic.** The bootloader has
        `CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE` and the firmware marks itself
        valid only once it is serving; an image that boots but cannot get that
        far is rolled back to the slot it replaced, with no cable involved.

        **This replaces the application only.** The web app, the shipped
        programs and the audio live in the LittleFS image and are not touched,
        so a device updated this way serves the bundle it already had.

        Refused with `409` while a program is running: the targets are
        mid-sequence and somebody may be downrange acting on what the sequence
        is doing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The application image.
      responses:
        "200":
          description: |
            Accepted and set as the boot partition. The device restarts
            shortly; there is no further call to make.
          content:
            application/json:
              schema:
                type: object
                required: [status, restarting]
                properties:
                  status:
                    type: string
                    enum: [accepted]
                  restarting:
                    type: boolean
        "400":
          description: |
            The upload was empty, too small to be an image, or not for this
            project.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Admin mode is on and the request carried no valid session.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A program is running.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /audios:
    get:
      tags: [audios]
      summary: List the stored audio clips
      operationId: listAudios
      security:
        - {}
      responses:
        "200":
          description: Every clip the device holds, shipped and uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioList"
    post:
      tags: [audios]
      summary: Upload an audio clip
      operationId: createAudio
      description: |
        A `multipart/form-data` body with one file part and a `title` field.

        The client's filename is never used on disk: only its `.wav`
        extension is checked, as an early reject, and the clip is streamed to
        a fixed staging file, validated, and renamed to `<id>.wav` once an id
        is assigned. Every failure path removes the staging file, so a
        repeated failed upload cannot fill the partition.

        Accepted audio is RIFF/WAVE, PCM (format tag 1), 16-bit, mono or
        stereo, with a non-zero sample rate and a non-empty `data` chunk.
        Chunks are walked rather than assumed, so a `LIST`/`INFO` chunk before
        `data` is fine.

        There is one staging slot, but no upload is ever refused for it: the
        server handles requests one at a time, so two uploads never overlap. A
        new upload always proceeds, starting by discarding anything an
        interrupted upload left staged — so an upload whose connection dies
        mid-body leaves nothing behind and cannot corrupt the next one.

        Two details of the vendored HTTP layer, recorded because clients rely
        on them in practice: the part name of the file is not inspected (any
        name works), and `title` is matched as a non-`POST` parameter, so it
        may equally be supplied as a `?title=` query parameter.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file:
                  type: string
                  format: binary
                  description: The clip. The filename must end in `.wav`.
                title:
                  type: string
                  minLength: 1
                  description: Display title. May also be given in the query string.
            encoding:
              file:
                contentType: audio/wav
      responses:
        "201":
          description: Stored. The body carries the assigned id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedId"
        "400":
          description: |
            - `/problems/upload_missing_file` — no file part arrived.
            - `/problems/upload_missing_title` — the `title` field is absent
              or empty.
            - `/problems/audio_format_unsupported` — not a playable PCM 16-bit
              WAV.

            A body over the 1 MiB ceiling is also answered `400`, but with a
            `text/html` body rather than a problem detail.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: |
            - `/problems/audio_store_failed` — the clip could not be moved
              into place or indexed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /audios/{id}/play:
    parameters:
      - $ref: "#/components/parameters/AudioId"
    post:
      tags: [audios]
      summary: Play a clip now
      operationId: playAudio
      description: >-
        Acknowledged immediately and played on the audio task — the response
        is not held open for the length of the clip.
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: Playback started.
          content:
            application/json:
              schema:
                type: object
                required: [message, audioId]
                properties:
                  message:
                    type: string
                    const: Playback started
                  audioId:
                    type: integer
                    format: int32
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            - `/problems/audio_not_found` — no such clip.
            - `/problems/route_not_found` — the path did not parse.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /audios/{id}/delete:
    parameters:
      - $ref: "#/components/parameters/AudioId"
    delete:
      tags: [audios]
      summary: Delete an uploaded clip
      operationId: deleteAudio
      description: |
        Shipped clips are read-only and answer `409`; only a clip that does not
        exist is a `404`.

        A clip that matters to a run cannot be deleted: a spoken command that
        silently fails mid-exercise is a range-safety problem. Refusal order,
        most specific reason first, and existence before all of them so a bogus
        id is never reported as a conflict:

        1. no such clip — `404`
        2. it is shipped with the firmware — `409` (the reason that never lifts)
        3. the loaded program plays it — `409`
        4. a run is in progress — `409`
        5. the audio task is reading it right now — `409`
      security:
        - adminBearer: []
        - adminCookie: []
        - {}
      responses:
        "200":
          description: Audio deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            - `/problems/audio_not_found` — no such clip.
            - `/problems/route_not_found` — the path did not parse.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            The clip is shipped, or it still matters to a run. Four types
            under one status, in the order the firmware checks them:

            - `/problems/audio_readonly` — shipped with the firmware, so there
              is no file of ours to remove. Checked first: it is the only one
              of these reasons that never lifts.
            - `/problems/audio_in_use` — an event of the loaded program plays
              it. Refused whether or not a run is in progress: `stop` is a
              pause, so a clip deleted between two runs would be missing when
              the program resumes. "Unload" is `POST /programs/unload`.
            - `/problems/program_running` — a run is in progress. Refused for
              every clip, referenced or not. The same type
              `POST /programs/unload` answers, because it is the same
              condition.
            - `/problems/audio_playing` — the audio task is reading the file
              right now. LittleFS has no unlink-while-open, so removing it
              would corrupt the read.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /sse/v2:
    get:
      tags: [sse]
      summary: The run-state event stream
      operationId: streamEvents
      servers:
        - url: http://rotation-target.local
          description: >-
            The stream is at the server root, not under `/api/v2`.
        - url: http://localhost:8080
          description: The firmware under QEMU.
      description: |
        Public, and specified in full in `contracts/asyncapi.yaml`: a
        `stateUpdate` on connect and after every mutation, a `heartbeat`
        every 10 seconds, and a `backend_issue` whenever the device hits a
        failure no request can be answered with.
      responses:
        "200":
          description: >-
            An open `text/event-stream`, with `Cache-Control: no-cache` and
            `Connection: keep-alive`.
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <token>`, where the token came from
        `/admin-mode/enable` or `/admin-mode/login`. Checked before the
        cookie.
    adminCookie:
      type: apiKey
      in: cookie
      name: admin
      description: >-
        The `admin` cookie set by `/admin-mode/enable` and
        `/admin-mode/login`. Only sent same-site, because the cookie is
        `SameSite=Lax`.

  parameters:
    ProgramId:
      name: id
      in: path
      required: true
      description: >-
        Program id. Must be a plain decimal integer within `int32`; anything
        else is a `404` rather than being read as id 0.
      schema:
        type: integer
        format: int32
        minimum: 0
    AudioId:
      name: id
      in: path
      required: true
      description: >-
        Audio clip id. Must be a plain decimal integer within `int32`.
      schema:
        type: integer
        format: int32
        minimum: 0

  responses:
    Unauthorized:
      description: |
        - `/problems/admin_credentials_required` — admin mode is on and no
          valid token was presented.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AdminSession:
      description: >-
        A session token, also set as a cookie.
      headers:
        Set-Cookie:
          description: "`admin=<token>; Path=/; SameSite=Lax`"
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required: [token]
            properties:
              token:
                type: string
                description: 32 hex characters (16 random bytes).
                pattern: "^[0-9a-f]{32}$"
            additionalProperties: false

  schemas:
    HardwareConfig:
      type: object
      description: |
        What a device can be told about its own hardware without rebuilding it
        (#144).

        Deliberately not everything in `main/config.h`. The `*_ENABLED` flags
        compile whole subsystems in or out, so making them runtime would mean
        always carrying the code for hardware that may not be present.

        `targetsShownAtBoot` is here but read-only: it is configurable, because
        which resting position is safe is a property of the target system, but
        only from the serial console (D-31). A safety default a remote UI can
        switch off is not one.

        Bank count is absent for the same reason it is fixed at one: banks are
        a contract change (D-08, D-20), not a configuration key.
      required:
        [
          targetGpio,
          targetActiveLow,
          hostname,
          displayName,
          targetsShownAtBoot,
          ledGpio,
          i2sPort,
          i2sBckGpio,
          i2sWsGpio,
          i2sDoutGpio,
          httpPort,
          wifiMaxRetries,
        ]
      additionalProperties: false
      properties:
        targetGpio:
          type: integer
          format: int32
          minimum: 0
          maximum: 48
          description: >-
            The GPIO driving the target circuit. 22-25 do not exist on this
            chip and 26-32 are the module's own flash and PSRAM; both are
            refused, because driving one stops the device booting rather than
            merely failing to move a target.
        targetActiveLow:
          type: boolean
          description: >-
            Whether a low level shows the targets. The prototype drives a
            BC547B whose low state opens the connection; a board that buffers
            or inverts the signal wants `false`.
        hostname:
          type: string
          minLength: 1
          maxLength: 20
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          description: >-
            mDNS name and the setup access point's SSID prefix, so
            `<hostname>.local` reaches the device and the portal appears as
            `<hostname>-setup-XXXX`. Two clubs on one network need two names.
            Bounded at 20 because the SSID suffix has to fit in 32.
        displayName:
          type: string
          maxLength: 40
          description: >-
            Free text shown in the web app. Cosmetic, and the only field here
            that cannot break anything - hence no format rule beyond a length.
            Empty on a device that has never been named.
        targetsShownAtBoot:
          type: boolean
          readOnly: true
          description: |
            Where the targets rest at boot.

            **Read-only here: it changes only from the serial console.** Which
            position is safe at rest is a property of the target system — one
            wired the opposite way round to ours needs the opposite value — so
            it has to be configurable. But it is also the setting that protects
            somebody standing downrange when a board is powered (D-31), and a
            web form is the wrong place to change that.

            Requiring physical access costs nothing in security: anyone at the
            USB port can already reflash the device. It rules out the remote
            mistake, which is the whole point.

            `boot-targets shown` / `boot-targets hidden` on the console, or
            `boot-targets` alone to read it back.

            Sending it to `PUT` is refused with
            `/problems/hardware_config_serial_only` rather than ignored — a
            change an operator believes they made is worse than one they were
            told they could not.
        ledGpio:
          type: integer
          format: int32
          minimum: 0
          maximum: 48
          description: >-
            The status LED's data pin. Carried even by a firmware built without
            the LED, so the value survives being flashed onto one that has it.
        i2sPort:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: >-
            Which of the chip's two I2S peripherals drives the DAC. A
            peripheral instance, not a pin, hence its own bounds.
        i2sBckGpio:
          type: integer
          format: int32
          minimum: 0
          maximum: 48
          description: The I2S bit clock pin.
        i2sWsGpio:
          type: integer
          format: int32
          minimum: 0
          maximum: 48
          description: The I2S word select (left/right clock) pin.
        i2sDoutGpio:
          type: integer
          format: int32
          minimum: 0
          maximum: 48
          description: The I2S serial data output pin, into the amplifier.
        httpPort:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: >-
            The port the web app and API are served on. mDNS advertises the
            host and not the port, so a device moved off 80 reports the port on
            the serial console — there is nothing else to ask.
        wifiMaxRetries:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          description: >-
            How many times to try the stored network before raising the setup
            portal. At roughly 2.4 s an attempt, 60 is about two and a half
            minutes; beyond that a device that cannot join looks broken rather
            than busy.

    ConfigWriteWindow:
      type: object
      description: |
        Whether the device is currently accepting hardware configuration.

        Guarded by a button press rather than a password. The threat is an
        accident - somebody editing a GPIO because it looked interesting - and
        an accidental change cannot involve walking to the device and pressing
        its button, so the gesture is the proof of deliberateness. Unlike a
        password there is nothing to generate, store, hand over, lose or
        rotate, and it improves on its own: put the board in an enclosure and
        the button is behind the key, with no code change.

        A client should use this to decide whether to *offer* the settings at
        all, rather than letting somebody fill a form that cannot be submitted.

        The window is RAM-only and dies with the boot: one that survived a
        restart would be one nobody remembers opening.
      required: [open, remainingSeconds]
      additionalProperties: false
      properties:
        open:
          type: boolean
          description: >-
            Whether `PUT /config/hardware` would be accepted. Always true on a
            build with no button, since refusing every change there would make
            the device unconfigurable rather than safe.
        remainingSeconds:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Seconds left, or 0. For a countdown, so a form does not simply stop
            working without explanation.

    HardwareConfigPatch:
      type: object
      description: |
        A partial hardware configuration: every field is optional and any field
        the body omits keeps its stored value.

        Separate from `HardwareConfig` rather than reusing it, because the two
        have opposite obligations. A response has to carry every field, so
        `HardwareConfig` requires them all; a request may carry one, so
        requiring anything here would break every client that sends less than
        the whole object - including this repository's own web app, which sends
        only what the operator touched so that a form left open cannot overwrite
        a value somebody else set in the meantime.

        `targetsShownAtBoot` is absent by construction: it is serial-only
        (D-31), and sending it is refused with
        `/problems/hardware_config_serial_only`.

        Kept in step with `HardwareConfig` by the web app's generated types -
        `HardwareConfigPatch` there is derived from this schema, so a field
        added to one and not the other stops compiling.
      additionalProperties: false
      properties:
        targetGpio:
          $ref: "#/components/schemas/HardwareConfig/properties/targetGpio"
        targetActiveLow:
          $ref: "#/components/schemas/HardwareConfig/properties/targetActiveLow"
        hostname:
          $ref: "#/components/schemas/HardwareConfig/properties/hostname"
        displayName:
          $ref: "#/components/schemas/HardwareConfig/properties/displayName"
        ledGpio:
          $ref: "#/components/schemas/HardwareConfig/properties/ledGpio"
        i2sPort:
          $ref: "#/components/schemas/HardwareConfig/properties/i2sPort"
        i2sBckGpio:
          $ref: "#/components/schemas/HardwareConfig/properties/i2sBckGpio"
        i2sWsGpio:
          $ref: "#/components/schemas/HardwareConfig/properties/i2sWsGpio"
        i2sDoutGpio:
          $ref: "#/components/schemas/HardwareConfig/properties/i2sDoutGpio"
        httpPort:
          $ref: "#/components/schemas/HardwareConfig/properties/httpPort"
        wifiMaxRetries:
          $ref: "#/components/schemas/HardwareConfig/properties/wifiMaxRetries"

    HardwareConfigState:
      type: object
      description: |
        Three views of one configuration, because they can legitimately differ.

        `active` is what the device is running on, latched at boot. `saved` is
        what is in NVS, which is `active` except between a write and the
        restart that adopts it. `defaults` is what the firmware was compiled
        with, so a client can mark what has been overridden and offer to put it
        back without knowing the compiled values.
      required: [active, saved, defaults, overridden, restartRequired, writeWindow]
      additionalProperties: false
      properties:
        active:
          $ref: "#/components/schemas/HardwareConfig"
        saved:
          $ref: "#/components/schemas/HardwareConfig"
        defaults:
          $ref: "#/components/schemas/HardwareConfig"
        overridden:
          type: boolean
          description: >-
            Whether `saved` differs from `defaults`. False out of the box, and
            false again after a reset - so a client can use it to decide
            whether a "reset to defaults" action would do anything. Note this
            is *not* "a value has ever been written": saving a value equal to
            its default leaves `overridden` false, because there is then
            nothing to put back.
        writeWindow:
          $ref: "#/components/schemas/ConfigWriteWindow"
        restartRequired:
          type: boolean
          description: >-
            `saved` differs from `active`, so the device is not yet running
            what it has been told. The one field a client must not hide: a pin
            change that appears to have done nothing is how somebody ends up
            reflashing a working device.

    Problem:
      type: object
      description: |
        An RFC 9457 problem detail — the shape every handler uses for a
        failure, served as `application/problem+json` (D-19). The one
        exception is a request body over the size ceiling, rejected by the
        HTTP layer with a `text/html` body.

        RFC 9457 permits extension members; this device emits none, which is
        what `additionalProperties: false` records.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            The problem type — **the member to branch on**. A stable relative
            URI that is never dereferenced.

            The enum is the whole vocabulary. It is open in practice: a client
            must fall back to `status` and `detail` for a value it does not
            recognise, because new types are additive and a client may be
            older than the firmware it is talking to.

            `/problems/program_invalid` is deliberately the same slug as the
            `program_invalid` `backend_issue` code in `asyncapi.yaml`.
          enum:
            # auth
            - /problems/admin_credentials_required
            - /problems/invalid_password
            # not found
            - /problems/route_not_found
            - /problems/program_not_found
            - /problems/audio_not_found
            # conflict / state
            - /problems/admin_mode_already_enabled
            - /problems/admin_mode_not_enabled
            - /problems/no_program_loaded
            - /problems/program_not_running
            - /problems/program_running
            - /problems/program_loaded
            - /problems/start_program_mismatch
            - /problems/skip_program_mismatch
            - /problems/program_readonly
            - /problems/audio_readonly
            - /problems/audio_in_use
            - /problems/audio_playing
            # validation
            - /problems/program_invalid
            - /problems/program_id_mismatch
            - /problems/series_index_invalid
            - /problems/start_id_required
            - /problems/skip_id_required
            - /problems/hardware_config_invalid
            - /problems/hardware_config_serial_only
            - /problems/hardware_config_window_closed
            # upload
            - /problems/upload_missing_file
            - /problems/upload_missing_title
            - /problems/audio_format_unsupported
            # internal
            - /problems/program_store_failed
            - /problems/audio_store_failed
        title:
          type: string
          description: >-
            A short summary of the type, identical for every occurrence of it.
            Not for display — it does not describe this occurrence.
          examples: ["Program is read-only"]
        status:
          type: integer
          description: >-
            The HTTP status, repeated in the body. One status per `type`,
            always, and always the status on the response line.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: >-
            What went wrong on this occurrence. This is the string to show a
            user, and the only member whose wording may change without a
            contract change — never branch on it.
          examples: ["Program is read-only and cannot be deleted"]
      additionalProperties: false

    Message:
      type: object
      description: The shape every handler uses for a plain success.
      required: [message]
      properties:
        message:
          type: string
      additionalProperties: false

    CreatedId:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int32
          description: >-
            The id the device assigned. Uploaded programs and clips are
            numbered from 100 upwards, keeping them clear of the shipped ids.
      additionalProperties: false

    StartRequest:
      type: object
      description: >-
        The program the caller decided to start. Required, and required to be
        an integer: a start with no id, or with an `id` of another type, is a
        `400` rather than a start of whatever happens to be loaded.
      required: [id]
      properties:
        id:
          type: integer
          format: int32
          description: The program the client last saw loaded and armed the start for.
      additionalProperties: false

    SkipRequest:
      type: object
      description: >-
        The program the caller decided the series index was for. Required,
        and required to be an integer, same shape as `StartRequest` (D-27,
        #105): a skip with no id, or with an `id` of another type, is a `400`
        rather than a selection on whatever happens to be loaded.
      required: [id]
      properties:
        id:
          type: integer
          format: int32
          description: The program the client last saw loaded and armed the skip for.
      additionalProperties: false

    PasswordBody:
      type: object
      description: >-
        A missing, unparseable or non-string `password` is treated as an empty
        password, which is refused with `401`.
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
      additionalProperties: false

    Version:
      type: object
      required: [major, minor, patch]
      properties:
        major:
          type: integer
          minimum: 0
        minor:
          type: integer
          minimum: 0
        patch:
          type: integer
          minimum: 0
      additionalProperties: false

    ProgramSummary:
      type: object
      required: [id, title, description, readonly]
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        readonly:
          type: boolean
          description: >-
            True for programs flashed with the firmware. Read-only programs
            cannot be deleted or updated.
      additionalProperties: false

    Program:
      type: object
      description: >-
        The full program document. Kept in lock-step with
        `contracts/program.schema.json`, which is the authoring schema for the
        files in `resources/programs/files/`.
      required: [id, title, description, readonly, series]
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        description:
          type: string
        readonly:
          type: boolean
        series:
          type: array
          items:
            $ref: "#/components/schemas/Series"
      additionalProperties: false

    ProgramUpdate:
      type: object
      description: >-
        The body of `PUT /programs/{id}`. `Program` with `id` made optional:
        the path is the authority on the id, so a body may leave it out
        entirely, and one declaring anything other than `{id}` is a `400`.
        Spelled out rather than referenced because a JSON Schema `allOf` cannot
        relax a `required` its base declares.
      required: [title, description, readonly, series]
      properties:
        id:
          type: integer
          format: int32
          description: >-
            Optional. If present it must equal `{id}` in the path.
        title:
          type: string
        description:
          type: string
        readonly:
          type: boolean
          description: Ignored; it follows from where the device stores the file.
        series:
          type: array
          items:
            $ref: "#/components/schemas/Series"
      additionalProperties: false

    Series:
      type: object
      required: [name, optional, events]
      properties:
        name:
          type: string
        optional:
          type: boolean
          description: >-
            Carried through the API but not acted on by the run loop: the
            executor runs one series at a time and never skips one by itself.
        timer_start_index:
          type: integer
          minimum: 0
          description: >-
            Index into this series' `events` of the event where the run timer
            reaches zero. Everything before it is preamble — the audio
            announcing the series, the count, the loading period — and is not
            shooting time. `stateUpdate.tickerMs` is measured from the start of
            this event: negative counting down to it, zero as it begins,
            positive after. Defaults to 0, which makes the ticker identical to
            elapsed-since-series-start, so a program without the field is
            unchanged. An index outside `events` is refused.
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
      additionalProperties: false

    Event:
      type: object
      description: >-
        One step: hold for `duration`, moving the targets and playing audio on
        entry. On the wire, `command` and `audio_ids` are omitted when empty.
      required: [duration]
      properties:
        duration:
          type: integer
          format: int32
          description: >-
            Milliseconds. Clamped to 1…3600000 on parse, so a `0` or negative
            value becomes 1 ms and an absurd one is capped rather than
            overflowing the series total.
          minimum: 0
        command:
          type: string
          enum: [show, hide]
          description: >-
            What to do with the targets on entering this event. Optional:
            omit it for a timed pause that leaves the targets where they are.
            When it is present it must be `show` or `hide` — the device
            refuses the whole program with `400` otherwise, so that a typo
            such as `shwo` fails at upload instead of becoming a target that
            silently never turns mid-exercise.


            For compatibility with the legacy program editor, which writes
            `null` for its "no change" option, the device also accepts `null`
            and the empty string in place of omission. Neither is part of this
            schema and neither is ever emitted: an event with no command has
            no `command` key.
        audio_ids:
          type: array
          description: >-
            Clips to start on entering this event. Ids that no longer exist
            are skipped.
          items:
            type: integer
            format: int32
      additionalProperties: false

    AudioList:
      type: object
      required: [audios]
      properties:
        audios:
          type: array
          items:
            $ref: "#/components/schemas/Audio"
      additionalProperties: false

    Audio:
      type: object
      required: [id, title, filename, readonly]
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
        filename:
          type: string
          description: >-
            The absolute path on the device's LittleFS mount, e.g.
            `/storage/shipped/audio/26.wav`. Named `filename` for
            compatibility with the MicroPython backend, which joined the
            directory into it the same way.
        readonly:
          type: boolean
          description: True for clips flashed with the firmware.
      additionalProperties: false

    PartitionInfo:
      type: object
      required:
        - name
        - kind
        - sizeBytes
      properties:
        name:
          type: string
          description: The partition label from `partitions.csv`, e.g. `storage`.
        kind:
          type: string
          enum: [app, data]
        sizeBytes:
          type: integer
          minimum: 0
          description: The slot's size, from the partition table.
        usedBytes:
          type: integer
          minimum: 0
          description: >-
            Absent where the device cannot tell. Present for the app slots (the
            length of the image on flash, walked from its header), the LittleFS
            partition, NVS (a whole number of 32-byte entries, so it is
            granular rather than exact) and the coredump partition (0 when no
            dump is stored).
        running:
          type: boolean
          description: >-
            App partitions only — whether this is the slot the device booted
            from.
    DiagnosticsInfo:
      type: object
      required:
        - version
        - idfVersion
        - buildDate
        - resetReason
        - uptimeSeconds
        - freeHeapBytes
        - minFreeHeapBytes
        - freePsramBytes
        - runningPartition
        - coredumpPresent
        - storageTotalBytes
        - storageUsedBytes
        - partitions
        - programCount
        - audioCount
        - ipAddress
        - targetGpio
        - targetGpioLevel
        - adminModeEnabled
        - startupIssues
      properties:
        version:
          type: string
          description: "`git describe` output, e.g. `2.0.0-3-gab12cde`."
        idfVersion:
          type: string
          description: The ESP-IDF version the firmware was built against.
        buildDate:
          type: string
          description: "Compiler date and time, e.g. `Aug 19 2026 11:42:03`."
        resetReason:
          type: string
          enum:
            - poweron
            - external
            - software
            - panic
            - interrupt_watchdog
            - task_watchdog
            - other_watchdog
            - deepsleep
            - brownout
            - sdio
            - usb
            - jtag
            - efuse
            - power_glitch
            - cpu_lockup
            - unknown
        uptimeSeconds:
          type: integer
          minimum: 0
        freeHeapBytes:
          type: integer
          minimum: 0
        minFreeHeapBytes:
          type: integer
          minimum: 0
          description: >-
            The low-water mark since boot, not the current figure: a leak that
            has already been reclaimed is invisible in the latter.
        freePsramBytes:
          type: integer
          minimum: 0
        runningPartition:
          type: string
          description: "The OTA partition label, e.g. `ota_0`, or `unknown`."
        coredumpPresent:
          type: boolean
          description: >-
            Whether a coredump image is waiting to be pulled out of band. The
            dump itself is never served.
        storageTotalBytes:
          type: integer
          minimum: 0
          description: >-
            The `storage` partition's size. Kept alongside `partitions`, which
            reports the same figure — this pair predates it and clients still
            read it.
        storageUsedBytes:
          type: integer
          minimum: 0
        partitions:
          type: array
          description: >-
            Every partition in the flash table, in flash-offset order. `storage`
            is not the only one that can fill: the app slots decide whether an
            over-the-air image will fit, and NVS holds the provisioned
            credentials.
          items:
            $ref: "#/components/schemas/PartitionInfo"
        programCount:
          type: integer
          minimum: 0
        audioCount:
          type: integer
          minimum: 0
        ipAddress:
          type: string
          description: The device's current address, or empty when it has none.
        targetGpio:
          type: integer
          description: The GPIO number the target hardware is wired to.
        targetGpioLevel:
          type: integer
          description: >-
            The level actually on the pad, read back rather than remembered —
            the pair with `targetGpio` distinguishes "the firmware never drove
            it" from "something else is holding it".
        adminModeEnabled:
          type: boolean
        startupIssues:
          type: array
          description: |
            The `backend_issue` events raised during boot, before the HTTP
            server was listening — today that is `program_invalid` from the
            program scan, and `program_id_collision`/`audio_id_collision` from
            either scan finding an uploaded id that already belongs to a
            shipped one, which run several steps ahead of the server. The SSE
            stream is fire-and-forget (see `contracts/asyncapi.yaml`), so those
            frames reached nobody: a stored program that would not parse
            simply disappeared from `GET /programs`, and a shadowed upload
            simply never took effect, both explained only on the serial
            console.

            Empty on a clean boot, which is the normal case. **At most 8
            entries**, oldest dropped, so an array of exactly 8 may be a
            truncated one; the device log remains the complete record.

            Written once during boot and read-only afterwards — the list does
            not grow while the device is up, and polling it will not show
            anything new until the next reboot. Run-time failures such as
            `audio_playback_failed` never appear here: they have a client to go
            to and are delivered over SSE.
          maxItems: 8
          items:
            $ref: "#/components/schemas/StartupIssue"
      additionalProperties: false

    StartupIssue:
      type: object
      description: >-
        One boot-time device-side failure. Deliberately the same shape as the
        SSE `backend_issue` payload in `contracts/asyncapi.yaml`, with the same
        `code` vocabulary, so a client has one way to describe a device failure
        rather than two.
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            The machine-readable identifier, from the same open set as
            `backend_issue.code` — tolerate a value this document does not
            list. Only codes that can be raised before the server exists appear
            here:

            - `program_invalid` — a file in a program directory could not be
              read or did not parse and was skipped, so the program is absent
              from `GET /programs`.
            - `program_id_collision` — an uploaded program's id already
              belongs to a shipped one (#129); the shipped program is kept and
              the uploaded file is left unloaded.
            - `audio_id_collision` — the audio equivalent of
              `program_id_collision`.
          x-extensible-enum:
            - program_invalid
            - program_id_collision
            - audio_id_collision
        message:
          type: string
          description: >-
            English prose describing the failure, suitable for a banner. Not
            stable across releases and not to be parsed.
        context:
          type: object
          description: >-
            What failed. Present whenever the emitter has something to name;
            keys depend on `code`.
          additionalProperties:
            type: string
          properties:
            file:
              type: string
              description: >-
                `program_invalid` and `program_id_collision`: the program
                file's path on the device filesystem. `audio_id_collision`:
                the audio index's path instead, since the collision is a
                shipped/uploaded id pair rather than one bad file.
