# Run before every commit:  pre-commit run --all-files
#
# Lives at the repository root because pre-commit resolves paths from the git
# root - so every pattern below is repo-root-relative, not firmware-relative.
#
# The clang-format hook rewrites files in place, so a first run failing and a
# second passing is the normal path - re-stage what it changed.
#
# Excluded: the vendored third-party trees, which must stay byte-identical to
# upstream; resources/, which is data; and contracts/history/, which is a
# frozen record of API v1 and must not be tidied.
exclude: |
  (?x)^(
    firmware/lib/psychic_http/.*|
    firmware/lib/arduinojson/.*|
    firmware/lib/dns_server/.*|
    resources/.*|
    contracts/history/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]

  # A generated sdkconfig holds the WiFi SSID and password and is gitignored -
  # but `idf.py` also writes sdkconfig.bak-<timestamp>, and one of those reached
  # a public repository through `git add -A`. Deleting it does not unpublish it,
  # so the guard is here rather than in a reviewer's attention.
  #
  # The defaults files are exempt: they carry the placeholder "changeme" and an
  # empty password, which is what makes a fresh clone start at the setup portal.
  - repo: local
    hooks:
      - id: no-committed-wifi-credentials
        name: no WiFi credentials in committed files
        language: pygrep
        entry: 'CONFIG_RT_WIFI_(SSID|PASSWORD)(_2)?="(?!changeme"|")'
        exclude: ^firmware/sdkconfig\.defaults
