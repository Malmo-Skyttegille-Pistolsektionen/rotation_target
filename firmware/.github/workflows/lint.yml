---
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded push should not keep a full firmware build running to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1

  workflows:
    name: yamllint + actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: yamllint
        run: pipx run yamllint .github .pre-commit-config.yaml .yamllint

      - name: actionlint
        uses: raven-actions/actionlint@v2
