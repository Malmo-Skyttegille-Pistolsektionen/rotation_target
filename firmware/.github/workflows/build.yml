---
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-test:
    # Runs first and on its own: the host tests need only IDF's Unity source,
    # not the cross toolchain, so they fail in ~a minute instead of after the
    # firmware build's toolchain download.
    name: host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out ESP-IDF (for Unity only)
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v6.0.2
          path: esp-idf
          submodules: false

      - name: Build and run
        env:
          IDF_PATH: ${{ github.workspace }}/esp-idf
        run: |
          cd host_test
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j"$(nproc)"
          cd build && ctest --output-on-failure

  firmware:
    name: firmware (esp32s3)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          # The LittleFS image is built from the resources submodule, so the
          # build fails outright without it.
          submodules: recursive

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build

      - name: Report image size
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py size

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/rotation_target_backend.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/storage.bin
          if-no-files-found: error
